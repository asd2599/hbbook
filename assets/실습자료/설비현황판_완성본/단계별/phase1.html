<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설비 가동률 현황판 (Phase 1 · 가짜 데이터)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f9; color: #1c2330; font-family: "Malgun Gothic", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; padding: 14px 24px; background: #1f3f7a; color: #fff; }
  header h1 { margin: 0; font-size: 20px; }
  header button { margin-left: auto; border: 0; border-radius: 7px; padding: 9px 15px; font: inherit; font-weight: 700; background: #fff; color: #1f3f7a; }
  .fake { margin: 14px 24px 0; padding: 9px 14px; border-radius: 8px; background: #fff4e0; color: #8a5200; font-weight: 700; }
  main { padding: 14px 24px 28px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid #dfe4ec; border-radius: 12px; padding: 14px 16px; }
  .kpi .k { color: #6b7585; font-size: 13px; }
  .kpi .v { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .kpi.red .v { color: #d93025; }
  .card { background: #fff; border: 1px solid #dfe4ec; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: #1f3f7a; }
  .ph { height: 170px; border-radius: 8px; background: repeating-linear-gradient(45deg, #eef1f6, #eef1f6 10px, #f7f9fc 10px, #f7f9fc 20px);
        display: flex; align-items: center; justify-content: center; color: #8a94a6; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #6b7585; padding: 8px; border-bottom: 2px solid #dfe4ec; }
  td { padding: 8px; border-bottom: 1px solid #eef1f5; }
  td.num, th.num { text-align: right; }
</style>
</head>
<body>
<header>
  <h1>설비 가동률 현황판</h1>
  <button>CSV 불러오기</button>
</header>
<p class="fake">⚠ 지금 보이는 숫자는 모두 가짜 데이터입니다 (Phase 1 — 화면 배치 확인용)</p>
<main>
  <div class="kpis">
    <div class="kpi"><div class="k">가동률</div><div class="v">93.5%</div></div>
    <div class="kpi"><div class="k">고장정지율</div><div class="v">2.1%</div></div>
    <div class="kpi"><div class="k">고장 건수</div><div class="v">24건</div></div>
    <div class="kpi red"><div class="k">주의 설비</div><div class="v">3대</div></div>
  </div>
  <div class="card"><h2>라인별 월 가동률</h2><div class="ph">차트 자리 (가짜)</div></div>
  <div class="card">
    <h2>설비별 가동률</h2>
    <table>
      <tr><th>라인</th><th>설비</th><th class="num">7월</th><th class="num">8월</th><th class="num">9월</th><th>주요 원인</th></tr>
      <tr><td>A 라인</td><td>설비 1</td><td class="num">95.0</td><td class="num">94.0</td><td class="num">93.0</td><td>-</td></tr>
      <tr><td>A 라인</td><td>설비 2</td><td class="num">92.0</td><td class="num">90.0</td><td class="num">88.0</td><td>가짜 원인</td></tr>
      <tr><td>B 라인</td><td>설비 3</td><td class="num">97.0</td><td class="num">96.0</td><td class="num">96.5</td><td>-</td></tr>
      <tr><td>B 라인</td><td>설비 4</td><td class="num">94.0</td><td class="num">95.0</td><td class="num">84.0</td><td>가짜 원인</td></tr>
    </table>
  </div>
</main>
</body>
</html>
